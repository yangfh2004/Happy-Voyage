# Publishes the release demo and the debug window tester to separate static branches.
name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: demo
            script: build
            directory: client/dist
          - branch: demo-debug
            script: build:debug
            directory: client/dist-debug
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -w client
        env:
          VITE_SERVER_URL: ${{ matrix.branch == 'demo' && (vars.RENDER_SERVER_URL || 'https://happy-voyage.onrender.com') || '' }}
      - name: Push the static build
        working-directory: ${{ matrix.directory }}
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$BRANCH"
