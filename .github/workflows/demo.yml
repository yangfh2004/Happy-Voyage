# Publishes the built client of main to the `demo` branch, which is served as a
# static site at https://raw.githack.com/yangfh2004/Happy-Voyage/demo/index.html
name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build -w client
      - name: Push client/dist to the demo branch
        working-directory: client/dist
        run: |
          git init -q -b demo
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" demo
