name: Publish desktop builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag (for example, v0.1)
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  GUIDE_NAME: Happy-Voyage-玩法说明.pdf
  CONFIG_GUIDE_NAME: Happy-Voyage-配置说明.pdf

concurrency:
  group: desktop-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Print the tagged Chinese guides and collect the default config
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk poppler-utils
          npm ci --prefix desktop
          mkdir -p guide
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | grep -Fx 'Noto Sans CJK SC'
          print_guide() {
            node desktop/gameplay-guide.mjs "$1" "guide/$2"
            pdftotext "guide/$2" "guide/$2.txt"
            heading="$(sed -n '1s/^# //p' "$1")"
            test -n "$heading"
            grep -Fx -- "$heading" "guide/$2.txt"
          }
          print_guide release-source/GAMEPLAY.md "$GUIDE_NAME"
          print_guide release-source/配置说明.md "$CONFIG_GUIDE_NAME"
          cp release-source/desktop/config.json guide/config.json
      - uses: actions/upload-artifact@v4
        with:
          name: happy-voyage-guide
          path: |
            guide/${{ env.GUIDE_NAME }}
            guide/${{ env.CONFIG_GUIDE_NAME }}
            guide/config.json
          if-no-files-found: error

  package:
    needs: guide
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: macos
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: release-source/package-lock.json
      - name: Build the tagged web client
        working-directory: release-source
        shell: bash
        env:
          VITE_SERVER_URL: ${{ vars.RENDER_SERVER_URL || 'https://happy-voyage.onrender.com' }}
        run: |
          npm ci
          npm run build -w client
          test -s client/dist/index.html
          test ! -e client/dist/debug.html
          cp -R client/dist ../client/dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Package desktop app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm ci
          npm test
          npm run package:${{ matrix.platform }}
      - uses: actions/download-artifact@v4
        with:
          name: happy-voyage-guide
          path: guide
      - name: Zip and verify Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "happy-voyage-win-x64.exe"
          $archive = "packages/happy-voyage-win-x64.zip"
          New-Item -ItemType Directory -Path packages | Out-Null
          $guides = @($env:GUIDE_NAME, $env:CONFIG_GUIDE_NAME, "config.json")
          $files = @("desktop/dist/$exe") + ($guides | ForEach-Object { "guide/$_" })
          Compress-Archive -LiteralPath $files -DestinationPath $archive
          Expand-Archive -LiteralPath $archive -DestinationPath verify
          foreach ($file in (@($exe) + $guides)) {
            if (!(Test-Path -LiteralPath "verify/$file" -PathType Leaf)) {
              throw "Windows ZIP is missing $file"
            }
          }
      - name: Zip macOS apps and verify signatures after extraction
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p packages
          for arch in x64 arm64; do
            if [[ "$arch" == x64 ]]; then
              app="desktop/dist/mac/Happy Voyage.app"
            else
              app="desktop/dist/mac-arm64/Happy Voyage.app"
            fi
            stage="$(mktemp -d)"
            verify="$(mktemp -d)"
            archive="packages/happy-voyage-mac-$arch.zip"
            ditto "$app" "$stage/Happy Voyage.app"
            cp "guide/$GUIDE_NAME" "guide/$CONFIG_GUIDE_NAME" guide/config.json "$stage/"
            ditto -c -k "$stage" "$archive"
            ditto -x -k "$archive" "$verify"
            for file in "$GUIDE_NAME" "$CONFIG_GUIDE_NAME" config.json; do
              cmp "guide/$file" "$verify/$file"
            done
            codesign --verify --deep --strict "$verify/Happy Voyage.app"
            codesign --display --verbose "$verify/Happy Voyage.app" 2>&1 | grep -F 'Signature=adhoc'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: happy-voyage-package-${{ matrix.platform }}
          path: packages/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: happy-voyage-package-*
          path: packages
          merge-multiple: true
      - name: Attach the three ZIPs and remove the old standalone Windows EXE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" \
            packages/happy-voyage-win-x64.zip packages/happy-voyage-mac-x64.zip packages/happy-voyage-mac-arm64.zip
          legacy="$(gh release view --repo "$GITHUB_REPOSITORY" --json assets \
            --jq 'any(.assets[]; .name == "happy-voyage-win-x64.exe")' -- "$RELEASE_TAG")"
          if [[ "$legacy" == true ]]; then
            gh release delete-asset --repo "$GITHUB_REPOSITORY" --yes -- "$RELEASE_TAG" happy-voyage-win-x64.exe
          fi
