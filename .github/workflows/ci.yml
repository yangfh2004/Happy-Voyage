name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm test -w client
      - run: npm run build
      - name: Verify debug and release build isolation
        run: |
          test ! -e client/dist/debug.html
          if grep -qrF 'window-tester' client/dist; then
            echo 'Window tester found in release assets'
            exit 1
          fi
          npm run build:debug -w client
          test -s client/dist-debug/debug.html
